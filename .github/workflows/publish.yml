name: Publish

on:
  workflow_dispatch:
    inputs:
      version:
        required: true
        description: The reference or tag
      java:
        required: false
        description: The build java version
        default: "17"
      mindustry_ref:
        required: false
        description: Custom commit/ref for Mindustry (defaults to version)
      arc_ref:
        required: false
        description: Custom commit/ref for Arc (defaults to version)

jobs:
  publish:
    name: Publish Mindustry and Arc
    runs-on: ubuntu-latest
    steps:
      - name: Checkout publisher
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7

      - name: Set up JDK
        uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6
        with:
          java-version: ${{ github.event.inputs.java }}
          distribution: 'temurin'

      - name: Checkout Mindustry
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7
        with:
          repository: 'Anuken/Mindustry'
          ref: ${{ github.event.inputs.mindustry_ref || github.event.inputs.version }}
          path: Mindustry

      - name: Checkout Arc
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7
        with:
          repository: 'Anuken/Arc'
          ref: ${{ github.event.inputs.arc_ref || github.event.inputs.version }}
          path: Arc

      - name: Install publisher dependencies
        run: python3 -m pip install --requirement requirements.txt

      - name: Restore Maven metadata
        run: |
          python3 scripts/s3_repository.py download-metadata "$HOME/.m2/repository" \
            com/github/Anuken/Mindustry \
            com/github/Anuken/Arc
        env:
          S3_ENDPOINT: "${{ secrets.S3_ENDPOINT }}"
          S3_BUCKET: "${{ secrets.S3_BUCKET }}"
          S3_ACCESS_KEY: "${{ secrets.S3_ACCESS_KEY }}"
          S3_SECRET_KEY: "${{ secrets.S3_SECRET_KEY }}"

      - name: Build and Install Mindustry and Arc
        env:
          VERSION: ${{ github.event.inputs.version }}
        run: |
          export JITPACK=true
          
          cd ./Arc
          sed -i "s/group = 'com.github.Anuken'/group = 'com.github.Anuken.Arc'/" build.gradle
          sed -i "s/version = '1.0'/version = '$VERSION'/" build.gradle
          sed -i '/withJavadocJar()/s/^/\/\/ /' build.gradle
          ./gradlew -Dfile.encoding=UTF-8 -Dhttps.protocols=TLSv1.2 -xtest assemble publishToMavenLocal
          
          cd ../Mindustry
          sed -i "s/group = 'com.github.Anuken'/group = 'com.github.Anuken.Mindustry'/" build.gradle
          sed -i "s/^archash=.*/archash=$VERSION/" gradle.properties
          sed -i '/withJavadocJar()/s/^/\/\/ /' build.gradle
          sed -i 's/com.github.Anuken\${localArc ? "" : ".Arc"}/com.github.Anuken.Arc/' build.gradle
          ./gradlew -PpackageVersion="$VERSION" -Dfile.encoding=UTF-8 -Dhttps.protocols=TLSv1.2 -Prelease -xtest assemble publishToMavenLocal
          
          find ~/.m2/repository/ -type f -name "maven-metadata-local.xml" -execdir mv {} maven-metadata.xml \;

      - name: Upload Updated Artifacts to S3
        run: python3 scripts/s3_repository.py upload "$HOME/.m2/repository"
        env:
          S3_ENDPOINT: "${{ secrets.S3_ENDPOINT }}"
          S3_BUCKET: "${{ secrets.S3_BUCKET }}"
          S3_ACCESS_KEY: "${{ secrets.S3_ACCESS_KEY }}"
          S3_SECRET_KEY: "${{ secrets.S3_SECRET_KEY }}"
